<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>For Artists | Disc Delivery</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles/style.css">
</head>
<body data-content-page="forArtists">
	<header class="site-header">
		<div class="header-row">
			<nav class="main-nav" aria-label="Main navigation">
				<ul data-site-nav></ul>
			</nav>
			<a class="wordmark" href="index.html" data-brand-name>Disc Delivery</a>
			<div class="header-icons">
				<a class="header-icon-link" href="/account" aria-label="Account" data-account-link>
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
				</a>
				<button class="header-icon-link cart-toggle" type="button" aria-label="Open cart" data-cart-toggle>
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
					<span class="cart-count" data-cart-count>0</span>
				</button>
			</div>
		</div>
	</header>

	<main class="simple-page">
		<h1 data-page-title>For Artists</h1>

		<section class="simple-page-block">
			<h2 data-who-title>Who are we looking for?</h2>
			<p data-who-body></p>
		</section>

		<section class="simple-page-block">
			<h2 data-chosen-title>Who gets chosen?</h2>
			<p data-chosen-body></p>
		</section>

		<section class="simple-page-block">
			<h2 data-do-title>What do we do?</h2>
			<p data-do-body></p>
		</section>

		<section class="simple-page-block">
			<h2 data-expect-title>What do we expect?</h2>
			<p data-expect-body></p>
		</section>

		<section class="simple-page-block">
			<h2 data-submit-title>How do I submit?</h2>
			<p data-submit-intro></p>
			<p><a data-submit-email href="mailto:apply@discdelivery.com">apply@discdelivery.com</a></p>
		</section>
	</main>

	<footer class="site-footer">
		<p class="footer-brand" data-brand-name>Disc Delivery</p>
		<p class="footer-legal" data-footer-legal></p>
		<p class="footer-copy" data-footer-copyright></p>
	</footer>

	<script src="scripts/site-content.js"></script>
	<script src="scripts/content-loader.js"></script>
</body>
</html>
