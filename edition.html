<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Edition | Disc Delivery</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles/style.css">
</head>
<body data-content-page="editionProduct">
	<header class="site-header">
		<div class="header-row">
			<nav class="main-nav" aria-label="Main navigation">
				<ul data-site-nav></ul>
			</nav>
			<a class="wordmark" href="index.html" data-brand-name>Disc Delivery</a>
			<div class="header-icons">
				<a class="header-icon-link" href="/account" aria-label="Account" data-account-link>
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
				</a>
				<button class="header-icon-link cart-toggle" type="button" aria-label="Open cart" data-cart-toggle>
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
					<span class="cart-count" data-cart-count>0</span>
				</button>
			</div>
		</div>
	</header>

	<main class="product-page">
		<div class="product-layout">
			<div class="product-media" data-product-media></div>
			<div>
				<h1 class="product-title" data-product-title>Edition</h1>
				<p class="product-meta" data-product-meta></p>
				<p class="product-description" data-product-description></p>
				<p class="product-price" data-product-price></p>

				<div class="product-action">
					<button class="btn" type="button" data-add-to-cart>Add to Cart</button>
				</div>

				<section class="product-info-block">
					<h2 data-tracklist-title>Featured Songs</h2>
					<ol class="tracklist" data-tracklist></ol>
				</section>

				<section class="product-info-block">
					<h2 data-shipping-title>Shipping</h2>
					<ul class="shipping-list" data-shipping-list><li></li></ul>
				</section>

				<a class="product-back-link" data-back-link href="past-editions.html">View all past editions</a>
			</div>
		</div>
	</main>

	<footer class="site-footer">
		<p class="footer-brand" data-brand-name>Disc Delivery</p>
		<p class="footer-legal" data-footer-legal></p>
		<p class="footer-copy" data-footer-copyright></p>
	</footer>

	<div class="cart-backdrop" data-cart-backdrop hidden></div>
	<aside class="cart-drawer" data-cart-drawer aria-hidden="true">
		<div class="cart-head">
			<h2>Cart</h2>
			<button class="cart-close" type="button" aria-label="Close cart" data-cart-close>&times;</button>
		</div>
		<p class="editions-empty" data-cart-empty>Your cart is empty.</p>
		<ul class="cart-items" data-cart-items></ul>
		<div class="cart-footer">
			<p class="cart-total"><span>Total</span><span data-cart-total>€0.00</span></p>
			<a class="btn cart-checkout" href="/checkout">Checkout</a>
		</div>
	</aside>

	<script src="scripts/site-content.js"></script>
	<script src="scripts/content-loader.js"></script>
	<script src="scripts/cart.js"></script>
</body>
</html>
