<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Shop | Disc Delivery</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles/style.css">
</head>
<body data-content-page="shop">
	<div class="page">
		<header class="site-header">
			<a class="logo-link" href="index.html" aria-label="Disc Delivery home">
				<img class="logo-image" src="assets/DiscDelivery_Logo_White.png" alt="Disc Delivery">
			</a>
			<nav class="nav" aria-label="Main navigation">
				<ul>
					<li><a href="join-club.html">Join The Club</a></li>
					<li><a href="shop.html" aria-current="page">Shop</a></li>
					<li><a href="about.html">About</a></li>
					<li><a href="contact.html">Contact</a></li>
					<li><a href="/account">Account</a></li>
				</ul>
			</nav>
		</header>

		<main class="new-page">
			<section class="section-slab section-slab--plain catalog-section">
				<div class="shop-header-row">
					<h2 class="section-heading page-main-title">Shop</h2>
					<button class="shop-cart-toggle" type="button" aria-label="Open cart" data-shop-cart-toggle>In Your Cart (<span data-shop-cart-count>0</span>)</button>
				</div>
			</section>

			<section class="shop-shell">
					<div class="shop-category-toggle" role="tablist" aria-label="Shop categories" data-shop-category-toggle>
						<button class="shop-category-option is-active" type="button" role="tab" aria-selected="true" data-shop-filter="past-editions">Past Editions</button>
						<button class="shop-category-option" type="button" role="tab" aria-selected="false" data-shop-filter="apparel">Apparel</button>
						<button class="shop-category-option" type="button" role="tab" aria-selected="false" data-shop-filter="small-goods">Small Goods</button>
					</div>

					<section class="shop-category-panel" data-shop-category="past-editions">
					<div class="product-grid-compact" data-shop-grid="past-editions"></div>
					</section>

					<section class="shop-category-panel" data-shop-category="apparel" hidden>
					<div class="product-grid-compact" data-shop-grid="apparel"></div>
					</section>

					<section class="shop-category-panel" data-shop-category="small-goods" hidden>
					<div class="product-grid-compact" data-shop-grid="small-goods"></div>
					</section>
				</div>
			</section>
		</main>

		<div class="shop-cart-backdrop" data-shop-cart-backdrop hidden></div>
		<aside class="shop-cart-drawer" data-shop-cart-drawer aria-hidden="true" aria-label="Shop cart">
			<div class="shop-cart-head">
				<h2>Your Cart</h2>
				<button class="shop-cart-close" type="button" aria-label="Close cart" data-shop-cart-close>×</button>
			</div>
			<div class="shop-cart-body">
				<p class="shop-cart-empty" data-shop-cart-empty>Your cart is empty.</p>
				<ul class="shop-cart-items" data-shop-cart-items></ul>
			</div>
			<div class="shop-cart-footer">
				<p class="shop-cart-total">Total <span data-shop-cart-total>€0.00</span></p>
				<a class="shop-cart-checkout" href="/checkout" data-shop-cart-checkout>Checkout</a>
			</div>
		</aside>

		<footer class="site-footer site-footer-legal" aria-label="Site footer">
			<p class="footer-line footer-brand">Disc Delivery</p>
			<p class="footer-line footer-links"><a href="privacy-policy.html">Privacy Policy</a><span aria-hidden="true">·</span><a href="terms-of-service.html">Terms of Service</a></p>
			<p class="footer-line footer-copy">© 2026 Disc Delivery</p>
		</footer>
		<script src="scripts/site-content.js"></script>
		<script src="scripts/content-loader.js"></script>
		<script src="scripts/pages.js"></script>
	</div>
</body>
</html>
